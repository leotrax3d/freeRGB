# SPDX-License-Identifier: GPL-2.0-or-later
[workspace]
resolver = "2"
members = ["crates/freergb-core", "crates/freergb-module-api", "modules/sayo-device"]
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leotrax3d/freeRGB"
rust-version = "1.80"
[workspace.dependencies]
freergb-core = { path = "crates/freergb-core" }
freergb-module-api = { path = "crates/freergb-module-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }