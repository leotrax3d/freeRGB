# Workspace manifest for the standalone source archive of this module.
# `freergb-module-tool source --manifest` stores it as the archive's root
# Cargo.toml, so the archive builds on its own:
#   cargo build --release -p freergb-module-razer-chroma
# Keep [workspace.package]/[workspace.dependencies] in sync with the root
# Cargo.toml (CI builds the archive to check this).
[workspace]
resolver = "2"
members = [
    "crates/freergb-core",
    "crates/freergb-module-api",
    "modules/razer-chroma",
]

[workspace.package]
version = "0.1.0-beta.5"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leotrax3d/freeRGB"
rust-version = "1.90"

[workspace.dependencies]
freergb-core = { path = "crates/freergb-core" }
freergb-module-api = { path = "crates/freergb-module-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
