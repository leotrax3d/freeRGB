# SPDX-License-Identifier: GPL-2.0-or-later
[package]
name = "freergb-module-luxafor"
description = "freeRGB Luxafor USB HID module, ported from OpenRGB"
version = "0.1.0"
edition.workspace = true
license = "GPL-2.0-or-later"
rust-version.workspace = true
publish = false
[[bin]]
name = "freergb-module-luxafor"
path = "src/main.rs"
[dependencies]
freergb-core.workspace = true
freergb-module-api = { path = "../../crates/freergb-module-api" }
serde_json.workspace = true
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = { level = "warn", priority = -1 }
