[workspace.package]
version = "0.1.0-beta.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leotrax3d/FreeRGB"
rust-version = "1.90"

[workspace.dependencies]
freergb-core = { path = "crates/freergb-core" }
freergb-device-api = { path = "crates/freergb-device-api" }
freergb-protocols = { path = "crates/freergb-protocols" }
freergb-effects = { path = "crates/freergb-effects" }
freergb-hid = { path = "crates/freergb-hid" }
freergb-client = { path = "crates/freergb-client" }
freergb-audio = { path = "crates/freergb-audio" }
freergb-screen = { path = "crates/freergb-screen" }
freergb-plugins = { path = "crates/freergb-plugins" }
freergb-control = { path = "crates/freergb-control" }
freergb-update = { path = "crates/freergb-update" }
freergb-module-api = { path = "crates/freergb-module-api" }
freergb-modules = { path = "crates/freergb-modules" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
# Upstream fix for RUSTSEC-2024-0429 without a GTK ABI migration.
glib = { path = "vendor/glib" }
