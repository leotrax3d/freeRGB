[workspace]
resolver = "2"
members = [
    "crates/signal-core",
    "crates/signal-device-api",
    "crates/signal-protocols",
    "crates/signal-effects",
    "crates/signal-hid",
    "crates/signal-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/signal-rs"
rust-version = "1.80"

[workspace.dependencies]
signal-core = { path = "crates/signal-core" }
signal-device-api = { path = "crates/signal-device-api" }
signal-protocols = { path = "crates/signal-protocols" }
signal-effects = { path = "crates/signal-effects" }
signal-hid = { path = "crates/signal-hid" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
