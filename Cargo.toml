[workspace]
resolver = "2"
exclude = ["vendor/glib"]
members = [
    "crates/freergb-effect-host",
    "crates/freergb-core",
    "crates/freergb-device-api",
    "crates/freergb-protocols",
    "crates/freergb-effects",
    "crates/freergb-hid",
    "crates/freergb-cli",
    "crates/freergb-daemon",
    "crates/freergb-client",
    "crates/freergb-gui",
    "crates/freergb-gui-win32",
    "crates/freergb-audio",
    "crates/freergb-screen",
    "crates/freergb-plugins",
    "crates/freergb-control",
    "crates/freergb-gpu-adlx",
    "crates/freergb-gpu-nvml",
    "crates/freergb-storage-temp",
    "crates/freergb-tray",
    "crates/freergb-update",
    "crates/freergb-module-api",
    "crates/freergb-modules",
    "crates/freergb-module-tool",
    "modules/razer-chroma",
    "modules/cooling-virtual",
    "modules/corsair-link-cooling",
    "modules/redragon-mouse",
    "modules/luxafor",
    "modules/msi-motherboard",
    "modules/asus-aura-usb",
    "modules/asus-aura-core",
    "modules/gigabyte-aorus-laptop",
    "modules/instant-mouse",
    "modules/msi-keyboard",
    "modules/msi-laptop",
    "modules/asus-legacy-usb",
    "modules/das-keyboard",
    "modules/fnatic-streak",
    "modules/steelseries",
    "modules/thermaltake-riing",
    "modules/logitech",
    "modules/corsair-peripheral",
    "modules/coolermaster",
    "modules/corsair-peripheral-v2",
    "modules/drgb",
    "modules/roccat",
    "modules/cherry",
    "modules/lenovo",
    "modules/nzxt-hue2",
    "modules/nollie",
    "modules/evision-keyboard",
    "modules/hyperx-keyboard",
    "modules/hyperx-mouse",
    "modules/gaizonggai",
    "modules/lianli",
    "modules/asus-monitor",
    "modules/corsair-commander-core",
    "modules/corsair-lighting-node",
    "modules/evga-usb",
    "modules/a4tech",
    "modules/areson",
    "modules/annepro2",
    "modules/royuan-keyboard",
    "modules/gigabyte-rgbfusion2",
    "modules/corsair-hydro-platinum",
    "modules/sinowealth",
    "modules/sony-gamepad",
]

[workspace.package]
version = "0.1.0-beta.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leotrax3d/FreeRGB"
rust-version = "1.90"

[workspace.dependencies]
freergb-core = { path = "crates/freergb-core" }
freergb-device-api = { path = "crates/freergb-device-api" }
freergb-protocols = { path = "crates/freergb-protocols" }
freergb-effects = { path = "crates/freergb-effects" }
freergb-hid = { path = "crates/freergb-hid" }
freergb-client = { path = "crates/freergb-client" }
freergb-audio = { path = "crates/freergb-audio" }
freergb-screen = { path = "crates/freergb-screen" }
freergb-plugins = { path = "crates/freergb-plugins" }
freergb-control = { path = "crates/freergb-control" }
freergb-update = { path = "crates/freergb-update" }
freergb-module-api = { path = "crates/freergb-module-api" }
freergb-modules = { path = "crates/freergb-modules" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
# Upstream fix for RUSTSEC-2024-0429 without a GTK ABI migration.
glib = { path = "vendor/glib" }
