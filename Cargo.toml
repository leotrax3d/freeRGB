[workspace]
resolver = "2"
members = [
    "crates/freergb-core",
    "crates/freergb-device-api",
    "crates/freergb-protocols",
    "crates/freergb-effects",
    "crates/freergb-hid",
    "crates/freergb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leotrax3d/FreeRGB"
rust-version = "1.80"

[workspace.dependencies]
freergb-core = { path = "crates/freergb-core" }
freergb-device-api = { path = "crates/freergb-device-api" }
freergb-protocols = { path = "crates/freergb-protocols" }
freergb-effects = { path = "crates/freergb-effects" }
freergb-hid = { path = "crates/freergb-hid" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
