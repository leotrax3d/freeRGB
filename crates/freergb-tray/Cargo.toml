[package]
name = "freergb-tray"
description = "Windows tray icon for the freeRGB background service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "freergb-tray"
path = "src/main.rs"

[dependencies]
freergb-client.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
png = "0.18"
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
# deny, not forbid: the Win32 message pump and single-instance mutex need FFI.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
