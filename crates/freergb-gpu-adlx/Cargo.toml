[package]
name = "freergb-gpu-adlx"
description = "Runtime-loaded AMD ADLX GPU fan control on Windows (driver-provided library, nothing bundled)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libloading = "0.8"

[lints.rust]
# deny, not forbid: the ADLX C interface is reached through documented FFI calls only.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
