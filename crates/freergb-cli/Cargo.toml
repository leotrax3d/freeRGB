freergb-effects.workspace = true
freergb-hid.workspace = true
freergb-client.workspace = true
freergb-audio.workspace = true
freergb-screen.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"
