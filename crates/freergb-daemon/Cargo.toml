[package]
name = "freergb-daemon"
description = "freeRGB background service: render loop, device management, local API"
default-run = "freergbd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "freergbd"
path = "src/main.rs"

[[bin]]
name = "freergb-cooling-pilot"
path = "src/bin/cooling_pilot.rs"

[features]
cooling-fixture = []

[[bin]]
name = "freergb-cooling-guard-fixture"
path = "tests/fixtures/cooling_guard.rs"
required-features = ["cooling-fixture"]

[dependencies]
freergb-core.workspace = true
freergb-device-api.workspace = true
freergb-protocols.workspace = true
freergb-effects.workspace = true
freergb-hid.workspace = true
freergb-audio.workspace = true
freergb-screen.workspace = true
freergb-plugins.workspace = true
freergb-modules.workspace = true
freergb-module-api.workspace = true
freergb-control.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time", "process"] }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
enigo = "0.6.1"
