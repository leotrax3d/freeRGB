[package]
name = "freergb-gui"
description = "Native freeRGB GUI (egui); talks to freergbd only through the local API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "freergb-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.30.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
freergb-client.workspace = true
serde_json.workspace = true
freergb-core.workspace = true
freergb-effects.workspace = true

[lints]
workspace = true
