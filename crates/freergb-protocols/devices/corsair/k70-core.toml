# CORSAIR K70 CORE RGB – Bragi protocol, validated on hardware 2026-10-18.
# Wire indices = USB HID keyboard usage IDs, except modifiers (105..111) and Fn (122).
# Source: LED index table of the SignalRGB Bragi plugin (interface facts), checked
# against the HID Usage Tables and visually on a K70 CORE ISO (see docs/DEVICES.md).

[device]
name = "CORSAIR K70 CORE RGB"
vendor = "Corsair"
kind = "keyboard"
adapter = "corsair-bragi"
support = "validated"
vendor_id = 0x1B1C
product_ids = [0x1BFD, 0x1BFF]
usage_page = 0xFF42
usage = 0x0001

[bragi]
stream_ack = true

