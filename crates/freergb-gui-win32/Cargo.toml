[package]
name = "freergb-gui-win32"
description = "Native Win32 freeRGB GUI (Windows only); talks to freergbd only through the local API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "freergb-gui-win32"
path = "src/main.rs"

[dependencies]
freergb-client.workspace = true
freergb-core.workspace = true
freergb-effects.workspace = true
freergb-control.workspace = true
freergb-update.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
] }

# The windowing layer needs FFI; everything above it stays safe.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }