[package]
name = "freergb-effect-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
freergb-core.workspace = true
freergb-effects.workspace = true
freergb-modules.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
wasmi = "0.35"
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
wat = "1"

[lints]
workspace = true
[features]
effect-fixture = []

[[bin]]
name = "freergb-effect-fixture"
path = "tests/support/fixture.rs"
required-features = ["effect-fixture"]
