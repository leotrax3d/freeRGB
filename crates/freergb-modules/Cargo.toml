[package]
name = "freergb-modules"
description = "Hardware module catalog, verified installation and process host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
freergb-core.workspace = true
freergb-device-api.workspace = true
freergb-module-api.workspace = true
freergb-control.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"

[lints]
workspace = true
