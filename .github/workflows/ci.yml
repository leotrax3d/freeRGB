name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FREERGB_SUPABASE_URL: ${{ vars.FREERGB_SUPABASE_URL }}
  FREERGB_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FREERGB_SUPABASE_PUBLISHABLE_KEY }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (udev for hidapi, X11/Wayland/GL for egui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libasound2-dev libgbm-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Desktop frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Desktop frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Desktop frontend build
        working-directory: apps/desktop
        run: npm run build
      - name: Desktop Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Desktop formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Desktop clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Desktop build
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --features tauri/custom-protocol --locked

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: Isolated cooling watchdog process tests (synthetic duties only)
        run: cargo test -p freergb-daemon --features cooling-fixture --test cooling_guard_process --locked

      - name: Windows optional motherboard helper (no hardware access)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-provider.ps1

      - name: Pinned native control adapter (synthetic callbacks, no driver access)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-control.ps1

      - name: Rust to C# native session over a real current-user pipe (synthetic)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-interop.ps1 -SkipBuild

      - name: Windows keyboard helper startup and cleanup (no events recorded)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-keyboard-helper.ps1 -CaptureLifecycle

      - name: Windows prerequisite installation logic (no system changes)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-prerequisites.ps1

      - name: Windows motherboard broker boundary (no service installation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-broker.ps1

      - name: Windows broker deployment transactions (no system changes)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-deployment.ps1

      - name: release build
        run: cargo build --workspace --release

      - name: Supabase rating row-level security
        if: runner.os == 'Linux'
        run: bash scripts/test-ratings-rls.sh

      - name: Linux effect marketplace process smoke
        if: runner.os == 'Linux'
        run: python3 scripts/test-effect-marketplace.py target/release/freergbd

      - name: Windows daemon and process plugin smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-daemon.ps1 -WithPlugin

      - name: Isolated live cooling API disabled/error cases (no hardware)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-cooling-session-api.ps1 -Daemon ./target/release/freergbd.exe
