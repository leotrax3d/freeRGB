name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FREERGB_SUPABASE_URL: ${{ vars.FREERGB_SUPABASE_URL }}
  FREERGB_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FREERGB_SUPABASE_PUBLISHABLE_KEY }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Layout (docs/TESTING.md "CI timings"): the workspace job keeps its check
# names (windows-latest, ubuntu-latest); the desktop app and the Windows
# release smoke run as parallel jobs. Caches are written only on main, PRs
# restore them. Docs-only changes skip the heavy jobs.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        name: Code or docs-only change
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          # Anything outside docs/, *.md and the website (own workflow) is code.
          if echo "$changed" | grep -Ev '^(docs/|website/)|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free runner disk space (debug and release workspace builds)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Release metadata and GLib backport integrity
        shell: bash
        run: |
          python scripts/check-release.py
          python scripts/test-release-preflight.py
          python scripts/check-glib-backport.py
      - name: Installer shutdown failure models (no real processes)
        shell: pwsh
        run: ./scripts/test-installer-process-scope.ps1

      - name: Linux system libraries (udev for hidapi, X11/Wayland/GL for egui, GLib tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev libasound2-dev libgbm-dev libglib2.0-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, pinned toolchain below
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: Isolated cooling watchdog process tests (synthetic duties only)
        run: cargo test -p freergb-daemon --features cooling-fixture --test cooling_guard_process --locked

      - name: Signed SMBus module process tests (register model only)
        run: cargo test -p freergb-daemon --features bus-fixture --test bus_process --locked

      - name: Cooling plugin reference e2e (virtual plugin, no hardware)
        run: |
          cargo build -p freergb-cooling-virtual --locked
          cargo test -p freergb-modules --test cooling_e2e --locked -- --ignored

      - name: Windows optional motherboard helper (no hardware access)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-provider.ps1

      - name: Pinned native control adapter (synthetic callbacks, no driver access)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-control.ps1

      - name: Rust to C# native session over a real current-user pipe (synthetic)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-interop.ps1 -SkipBuild

      - name: Windows keyboard helper startup and cleanup (no events recorded)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-keyboard-helper.ps1 -CaptureLifecycle

      - name: Windows prerequisite installation logic (no system changes)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-prerequisites.ps1

      - name: Windows motherboard broker boundary (no service installation)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-broker.ps1

      - name: Windows broker deployment transactions (no system changes)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-mainboard-deployment.ps1

      # Linux keeps its release steps here (fast runner); Windows release
      # build and smoke run in the parallel `windows-release` job.
      - name: release build
        if: runner.os == 'Linux'
        run: cargo build --workspace --release --locked
      - name: Optimized GLib soundness regression
        if: runner.os == 'Linux'
        run: cargo test -p freergb-screen --test glib_variant --release --locked

      - name: Supabase rating row-level security
        if: runner.os == 'Linux'
        run: bash scripts/test-ratings-rls.sh

      - name: Linux effect marketplace process smoke
        if: runner.os == 'Linux'
        run: python3 scripts/test-effect-marketplace.py target/release/freergbd

      - name: Linux package staging and Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y dpkg-dev
          bash packaging/linux/test-stage.sh
          bash packaging/linux/build.sh deb
          dpkg-deb --info target/linux-packages/*.deb
          dpkg-deb --contents target/linux-packages/*.deb

  windows-release:
    name: windows release smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, pinned toolchain below
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: release build
        run: cargo build --workspace --release --locked
      - name: Windows daemon and process plugin smoke test
        shell: pwsh
        run: ./scripts/smoke-daemon.ps1 -WithPlugin
      - name: Isolated live cooling API disabled/error cases (no hardware)
        shell: pwsh
        run: ./scripts/test-cooling-session-api.ps1 -Daemon ./target/release/freergbd.exe

  desktop:
    name: desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux system libraries (WebKitGTK for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libgl1-mesa-dev libclang-dev libasound2-dev libpipewire-0.3-dev libspa-0.2-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, pinned toolchain below
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: desktop
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Desktop frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Desktop frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Community identity, quota and privacy tests (mock backend)
        working-directory: appwrite/community
        run: npm test
      - name: Desktop frontend build
        working-directory: apps/desktop
        run: npm run build
      - name: Desktop formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Desktop clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Desktop Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Desktop build
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --features tauri/custom-protocol --locked
