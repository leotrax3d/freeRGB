name: Package
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: cargo test --workspace --locked
      - name: Isolated cooling watchdog process tests (synthetic duties only)
        run: cargo test -p freergb-daemon --features cooling-fixture --test cooling_guard_process --locked
      - name: Optional motherboard provider transport (no hardware)
        shell: pwsh
        run: ./scripts/test-mainboard-provider.ps1
      - name: Pinned native control adapter (synthetic callbacks, no driver access)
        shell: pwsh
        run: ./scripts/test-mainboard-control.ps1
      - name: Official prerequisite download and staging acceptance (no installation)
        shell: pwsh
        run: ./scripts/test-mainboard-prerequisites.ps1 -VerifyDownloads
      - name: Motherboard broker boundary acceptance (no service installation)
        shell: pwsh
        run: ./scripts/test-mainboard-broker.ps1
      - name: Keyboard input helper startup and cleanup (no events recorded)
        shell: pwsh
        run: ./scripts/test-keyboard-helper.ps1 -CaptureLifecycle
      - name: Protected broker deployment transactions (no system changes)
        shell: pwsh
        run: ./scripts/test-mainboard-deployment.ps1 -VerifyRuntime
      - name: Disposable SCM lifecycle with synthetic sensor worker (no driver access)
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/test-mainboard-service.ps1
      - name: Release binaries
        run: cargo build --workspace --release --locked
      - name: Ensure installer compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe") -and -not (Test-Path "$env:ProgramFiles/Inno Setup 7/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1
      - name: IPC smoke
        shell: pwsh
        run: ./scripts/smoke-daemon.ps1 -WithPlugin
      - name: Isolated installer lifecycle acceptance
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freeRGB-installer-acceptance-logs
          path: target/installer-acceptance/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: freeRGB-windows-installer
          path: target/dist/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeRGB-windows-installer
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
