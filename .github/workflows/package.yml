name: Package
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Public client configuration, never a Supabase service-role key.
env:
  FREERGB_SUPABASE_URL: ${{ vars.FREERGB_SUPABASE_URL }}
  FREERGB_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FREERGB_SUPABASE_PUBLISHABLE_KEY }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release metadata and GLib backport integrity
        shell: pwsh
        run: |
          python scripts/check-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata preflight failed.' }
          python scripts/check-glib-backport.py
          if ($LASTEXITCODE -ne 0) { throw 'GLib backport preflight failed.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/check-release.py --tag $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Release tag/version mismatch.' }
          }
      - name: Ensure installer compiler
        shell: pwsh
        run: |
          $compiler = ./scripts/install-inno-compiler.ps1 -Destination "$env:RUNNER_TEMP/InnoSetup-6.7.3"
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action, pinned toolchain below
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Tests
        run: cargo test --workspace --locked
      - name: Desktop tests and locked Windows graph
        shell: pwsh
        run: |
          npm ci --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Frontend install failed.' }
          npm test --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Rust tests failed.' }
      - name: Installer shutdown failure models (no real processes)
        shell: pwsh
        run: ./scripts/test-installer-process-scope.ps1
      - name: Isolated cooling watchdog process tests (synthetic duties only)
        run: cargo test -p freergb-daemon --features cooling-fixture --test cooling_guard_process --locked
      - name: Signed SMBus module process tests (register model only)
        run: cargo test -p freergb-daemon --features bus-fixture --test bus_process --locked
      - name: Optional motherboard provider transport (no hardware)
        shell: pwsh
        run: ./scripts/test-mainboard-provider.ps1
      - name: Pinned native control adapter (synthetic callbacks, no driver access)
        shell: pwsh
        run: ./scripts/test-mainboard-control.ps1
      - name: Official prerequisite download and staging acceptance (no installation)
        shell: pwsh
        run: ./scripts/test-mainboard-prerequisites.ps1 -VerifyDownloads
      - name: Motherboard broker boundary acceptance (no service installation)
        shell: pwsh
        run: ./scripts/test-mainboard-broker.ps1
      - name: Keyboard input helper startup and cleanup (no events recorded)
        shell: pwsh
        run: ./scripts/test-keyboard-helper.ps1 -CaptureLifecycle
      - name: Protected broker deployment transactions (no system changes)
        shell: pwsh
        run: ./scripts/test-mainboard-deployment.ps1 -VerifyRuntime
      - name: Disposable SCM lifecycle with synthetic sensor worker (no driver access)
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/test-mainboard-service.ps1
      - name: Release binaries
        run: cargo build --workspace --release --locked
      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -Compiler $env:INNO_COMPILER
      - name: Verify candidate artifact checksums and provenance
        run: python scripts/check-release.py --artifacts target/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freeRGB-windows-installer
          path: target/dist/*
          if-no-files-found: error
      - name: IPC smoke
        shell: pwsh
        run: ./scripts/smoke-daemon.ps1 -WithPlugin
      - name: Isolated installer lifecycle acceptance
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Compiler $env:INNO_COMPILER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: freeRGB-installer-acceptance-logs
          path: target/installer-acceptance/*
          if-no-files-found: warn
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: freeRGB-windows-installer
          path: dist
      - name: Reverify exact artifacts before draft creation
        run: python scripts/check-release.py --tag "$GITHUB_REF_NAME" --artifacts dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --notes-file "docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
