name: Hardware modules
# Builds, packages, source-archives and signs downloadable hardware modules.
# See docs/HARDWARE_MODULES.md. Nothing is published unless a person starts the
# workflow manually with `publish: true`; tag pushes only produce artifacts.
on:
  push:
    tags: ['module-*-v*']
  workflow_dispatch:
    inputs:
      module:
        description: Module id (directory under modules/)
        default: razer-chroma
        required: true
      publish:
        description: Upload catalog and packages to the "modules" release (draft until published by hand)
        type: boolean
        default: false

permissions:
  contents: read

env:
  MODULE: ${{ inputs.module || 'razer-chroma' }}
  OPENRGB_COMMIT: bbc77470a7cba56af60989e54ba910d5ac66a3ac

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Module tests
        run: cargo test -p freergb-module-${{ env.MODULE }} -p freergb-module-api -p freergb-modules --locked
      - name: End-to-end with the installed module (simulated device)
        if: env.MODULE == 'razer-chroma'
        run: |
          cargo build -p freergb-module-razer-chroma --locked
          cargo test -p freergb-modules --test e2e --locked -- --ignored
      - name: Build
        run: cargo build --release --locked -p freergb-module-${{ env.MODULE }} -p freergb-module-tool
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps | jq -r ".packages[] | select(.name==\"freergb-module-$MODULE\") | .version")
          mkdir -p dist
          exe=target/release/freergb-module-$MODULE${{ matrix.exe }}
          "$exe" --list-devices > dist/devices.json
          target/release/freergb-module-tool${{ matrix.exe }} pack --id "$MODULE" --version "$version" --family "$MODULE" \
            --license GPL-2.0-or-later --target ${{ matrix.target }} --executable "$exe" --devices dist/devices.json \
            --file modules/$MODULE/COPYING --file modules/$MODULE/PROVENANCE.md \
            --out "dist/freergb-module-$MODULE-$version-${{ matrix.target }}.zip"
          rm dist/devices.json
      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated device table matches the pinned OpenRGB commit
        if: env.MODULE == 'razer-chroma' || env.MODULE == 'redragon-mouse' || env.MODULE == 'luxafor' || env.MODULE == 'steelseries' || env.MODULE == 'msi-motherboard' || env.MODULE == 'das-keyboard' || env.MODULE == 'asus-aura-usb' || env.MODULE == 'asus-legacy-usb' || env.MODULE == 'asus-aura-core' || env.MODULE == 'instant-mouse' || env.MODULE == 'sony-gamepad' || env.MODULE == 'msi-keyboard' || env.MODULE == 'msi-laptop'
        run: |
          git init -q openrgb && cd openrgb
          git remote add origin https://gitlab.com/CalcProgrammer1/OpenRGB.git
          git fetch -q --depth 1 origin "$OPENRGB_COMMIT" && git checkout -q FETCH_HEAD
          cd ..
          if [ "$MODULE" = "razer-chroma" ]; then
            node scripts/openrgb/port-razer-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/razer-chroma/src/devices_table.rs
          elif [ "$MODULE" = "redragon-mouse" ]; then
            node scripts/openrgb/port-redragon-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/redragon-mouse/src/devices_table.rs
          elif [ "$MODULE" = "luxafor" ]; then
            node scripts/openrgb/port-luxafor-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/luxafor/src/devices_table.rs
          elif [ "$MODULE" = "steelseries" ]; then
            node scripts/openrgb/port-steelseries-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/steelseries/src/devices_table.rs
          elif [ "$MODULE" = "msi-motherboard" ]; then
            node scripts/openrgb/port-msi-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/msi-motherboard/src/devices_table.rs
          elif [ "$MODULE" = "das-keyboard" ]; then
            node scripts/openrgb/port-das-keyboard-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/das-keyboard/src/devices_table.rs
          elif [ "$MODULE" = "asus-aura-usb" ]; then
            node scripts/openrgb/port-asus-aura-usb-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/asus-aura-usb/src/devices_table.rs
          elif [ "$MODULE" = "asus-legacy-usb" ]; then
            node scripts/openrgb/port-asus-legacy-usb-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/asus-legacy-usb/src/devices_table.rs
          elif [ "$MODULE" = "asus-aura-core" ]; then
            node scripts/openrgb/port-asus-aura-core-devices.mjs openrgb "$OPENRGB_COMMIT"
            git diff --exit-code -- modules/asus-aura-core/src/devices_table.rs
          elif [ "$MODULE" = "instant-mouse" ]; then
            node scripts/openrgb/port-instant-mouse-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-instant-mouse
            git diff --exit-code -- modules/instant-mouse/src/devices_table.rs
          elif [ "$MODULE" = "sony-gamepad" ]; then
            node scripts/openrgb/port-sony-gamepad-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-sony-gamepad
            git diff --exit-code -- modules/sony-gamepad/src/devices_table.rs
          elif [ "$MODULE" = "msi-keyboard" ]; then
            node scripts/openrgb/port-msi-keyboard-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-msi-keyboard
            git diff --exit-code -- modules/msi-keyboard/src/devices_table.rs
          elif [ "$MODULE" = "msi-laptop" ]; then
            node scripts/openrgb/port-msi-laptop-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-msi-laptop
            git diff --exit-code -- modules/msi-laptop/src/devices_table.rs
          elif [ "$MODULE" = "thermaltake-riing" ]; then
            node scripts/openrgb/port-thermaltake-riing-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-thermaltake-riing
            git diff --exit-code -- modules/thermaltake-riing/src/devices_table.rs
          elif [ "$MODULE" = "cherry" ]; then
            node scripts/openrgb/port-cherry-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-cherry
            git diff --exit-code -- modules/cherry/src/devices_table.rs
          elif [ "$MODULE" = "logitech" ]; then
            node scripts/openrgb/port-logitech-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-logitech
            git diff --exit-code -- modules/logitech/src/devices_table.rs
          elif [ "$MODULE" = "nollie" ]; then
            node scripts/openrgb/port-nollie-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-nollie
            git diff --exit-code -- modules/nollie/src/devices_table.rs
          elif [ "$MODULE" = "corsair-hydro-platinum" ]; then
            node scripts/openrgb/port-corsair-hydro-platinum-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-corsair-hydro-platinum
            git diff --exit-code -- modules/corsair-hydro-platinum/src/devices_table.rs
          elif [ "$MODULE" = "corsair-peripheral" ]; then
            node scripts/openrgb/port-corsair-peripheral-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-corsair-peripheral
            git diff --exit-code -- modules/corsair-peripheral/src/devices_table.rs
          elif [ "$MODULE" = "corsair-lighting-node" ]; then
            node scripts/openrgb/port-corsair-lighting-node-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-corsair-lighting-node
            git diff --exit-code -- modules/corsair-lighting-node/src/devices_table.rs
          elif [ "$MODULE" = "corsair-commander-core" ]; then
            node scripts/openrgb/port-corsair-commander-core-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-corsair-commander-core
            git diff --exit-code -- modules/corsair-commander-core/src/devices_table.rs
          elif [ "$MODULE" = "asus-monitor" ]; then
            node scripts/openrgb/port-asus-monitor-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-asus-monitor
            git diff --exit-code -- modules/asus-monitor/src/devices_table.rs
          elif [ "$MODULE" = "drgb" ]; then
            echo "drgb device table is inventoried manually; add a generator before enabling support" >&2
          elif [ "$MODULE" = "nzxt-hue2" ]; then
            node scripts/openrgb/port-nzxt-hue2-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-nzxt-hue2
            git diff --exit-code -- modules/nzxt-hue2/src/devices_table.rs
          elif [ "$MODULE" = "hyperx-mouse" ]; then
            node scripts/openrgb/port-hyperx-mouse-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-hyperx-mouse
            git diff --exit-code -- modules/hyperx-mouse/src/devices_table.rs
          elif [ "$MODULE" = "areson" ]; then
            node scripts/openrgb/port-areson-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-areson
            git diff --exit-code -- modules/areson/src/devices_table.rs
          elif [ "$MODULE" = "annepro2" ]; then
            node scripts/openrgb/port-annepro2-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-annepro2
            git diff --exit-code -- modules/annepro2/src/devices_table.rs modules/annepro2/src/led_names.rs
          elif [ "$MODULE" = "fnatic-streak" ]; then
            node scripts/openrgb/port-fnatic-streak-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-fnatic-streak
            git diff --exit-code -- modules/fnatic-streak/src/devices_table.rs
          elif [ "$MODULE" = "gigabyte-aorus-laptop" ]; then
            node scripts/openrgb/port-gigabyte-aorus-laptop-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-gigabyte-aorus-laptop
            git diff --exit-code -- modules/gigabyte-aorus-laptop/src/devices_table.rs
          elif [ "$MODULE" = "a4tech" ]; then
            node scripts/openrgb/port-a4tech-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-a4tech
            git diff --exit-code -- modules/a4tech/src/devices_table.rs
          elif [ "$MODULE" = "evga-usb" ]; then
            node scripts/openrgb/port-evga-usb-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-evga-usb
            git diff --exit-code -- modules/evga-usb/src/devices_table.rs
          elif [ "$MODULE" = "gaizonggai" ]; then
            node scripts/openrgb/port-gaizonggai-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-gaizonggai
            git diff --exit-code -- modules/gaizonggai/src/devices_table.rs
          elif [ "$MODULE" = "lenovo" ]; then
            echo "lenovo detector table is from the audited branch version (no generator yet)" >&2
          elif [ "$MODULE" = "hyperx-keyboard" ]; then
            node scripts/openrgb/port-hyperx-keyboard-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-hyperx-keyboard
            git diff --exit-code -- modules/hyperx-keyboard/src/devices_table.rs modules/hyperx-keyboard/src/layouts.rs
          elif [ "$MODULE" = "evision-keyboard" ]; then
            node scripts/openrgb/port-evision-keyboard-devices.mjs openrgb "$OPENRGB_COMMIT"
            cargo fmt --package freergb-module-evision-keyboard
            git diff --exit-code -- modules/evision-keyboard/src/devices_table.rs
          else
            echo "unknown module generator: $MODULE" >&2
            exit 1
          fi
      - name: Source archive
        run: |
          set -euo pipefail
          cargo build --release --locked -p freergb-module-tool
          version=$(cargo metadata --format-version 1 --no-deps | jq -r ".packages[] | select(.name==\"freergb-module-$MODULE\") | .version")
          mkdir -p dist
          target/release/freergb-module-tool source --root . --manifest modules/$MODULE/source-workspace.toml \
            --path Cargo.lock --path LICENSE-MIT --path LICENSE-APACHE --path crates/freergb-core \
            --path crates/freergb-module-api --path modules/$MODULE --path scripts/openrgb \
            --out "dist/freergb-module-$MODULE-$version-source.zip"
      - name: Source archive builds on its own
        run: |
          mkdir check && cd check && unzip -q ../dist/*-source.zip
          cargo build --release -p freergb-module-$MODULE
      - uses: actions/upload-artifact@v4
        with:
          name: module-source
          path: dist/*.zip
          if-no-files-found: error

  catalog:
    needs: [build, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build tool
        run: cargo build --release --locked -p freergb-module-tool
      - name: Update and sign catalog
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.FREERGB_MODULE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Secret FREERGB_MODULE_SIGNING_KEY is not configured (see docs/HARDWARE_MODULES.md)"; exit 1
          fi
          tool=target/release/freergb-module-tool
          # Continue the existing catalog so other modules and the sequence stay.
          gh release download modules --pattern catalog.json --dir dist 2>/dev/null || echo "starting a new catalog"
          umask 077 && printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/module.key"
          packages=(); for p in dist/freergb-module-$MODULE-*-x86_64-*.zip; do packages+=(--package "$p"); done
          FREERGB_CATALOG_DATE=$(date -u +%F) $tool add --catalog dist/catalog.json --name "$(jq -r .name modules/$MODULE/module-info.json)" \
            "${packages[@]}" --source-package dist/freergb-module-$MODULE-*-source.zip \
            --origin-project "$(jq -r .origin.project modules/$MODULE/module-info.json)" \
            --origin-url "$(jq -r .origin.url modules/$MODULE/module-info.json)" \
            --origin-commit "$(jq -r .origin.commit modules/$MODULE/module-info.json)" \
            $(jq -r '.vendors[] | "--vendor " + .' modules/$MODULE/module-info.json)
          $tool sign --key "$RUNNER_TEMP/module.key" --catalog dist/catalog.json
          rm -f "$RUNNER_TEMP/module.key"
          pub=$(grep -Ev '^\s*(#|$)' crates/freergb-modules/keys/release-keys.txt | head -n1)
          $tool verify --pubkey "$pub" --dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: module-release
          path: dist/*
      - name: Upload to the modules release (manual publish only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modules >/dev/null 2>&1 || gh release create modules --draft --title "Hardware modules" \
            --notes "Signed hardware module catalog and packages. Licenses and sources: see each module's source archive."
          gh release upload modules dist/catalog.json dist/catalog.json.sig dist/freergb-module-*.zip --clobber
